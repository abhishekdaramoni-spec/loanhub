{% extends 'base.html' %}

{% block title %}LoanSphere | Page Not Found{% endblock %}

{% block content %}
<section class="py-5" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div class="container text-center">
        <div class="max-width-600 mx-auto py-5 reveal">
            <i class="fas fa-triangle-exclamation text-warning mb-4" style="font-size: 6rem; opacity: 0.8;"></i>
            <h1 class="display-3 fw-bold mb-3"><span class="text-gradient">404</span></h1>
            <h3 class="fw-bold mb-3">Oops! Page Not Found</h3>
            <p class="text-muted mb-4">The URL page you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2"><i class="fas fa-home me-2"></i>Go to Homepage</a>
        </div>
    </div>
</section>
{% endblock %}
